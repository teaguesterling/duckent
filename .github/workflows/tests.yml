#
# Gates specific to this extension (as opposed to the generic extension-template
# workflows ExtensionTemplate.yml / MainDistributionPipeline.yml above it).
#
name: Tests
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  macro-identity:
    name: embedded macros, test suites and mutants match the plan repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      # NOTE: teaguesterling/duckent is the plan repo. The plan
      # (2026-10-09-duckent-cpp-mvp, Task 11) renames that repository to
      # duckent-plan at the very end -- when that happens, this checkout
      # must be updated to the new name in the SAME commit as the rename,
      # or this job starts failing for a reason that has nothing to do with
      # macro drift.
      - uses: actions/checkout@v4
        with:
          repository: teaguesterling/duckent
          path: .plan
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/check_macro_identity.py --plan-repo .plan

  gate:
    name: 16 suites, 495+ assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: make
      # `set -o pipefail` is load-bearing, not boilerplate. GitHub's implicit shell is
      # `bash -e {0}`, which reports the exit status of the LAST command in a pipeline --
      # `tee` -- so without pipefail a `make test` that crashes after Catch2 printed a
      # passing summary leaves this step green. check_gate.py reads text and never an exit
      # code, so it would not see it either. Measured: `bash -e -c 'false | tee f'` exits
      # 0; with `-eo pipefail` it exits 1. check_gate.py's crash-signature check is the
      # second, independent guard against the same failure.
      - run: set -o pipefail; make test 2>&1 | tee test.log
        shell: bash
      - run: python3 test/check_gate.py test.log

  mutants:
    name: the planted defects in this increment are all killed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: make
      # No plan-repo checkout here, unlike macro-identity and compile-differential: the
      # mutant corpus is COPIED into test/mutants/ (and held byte-identical to the plan
      # repo's by the macro-identity job), and the harness rebuilds each in-scope mutant
      # from src/sql_macros/ to prove the copy is still its source plus the planted edit.
      #
      # No rebuild per mutant either. A mutant is applied as a `CREATE OR REPLACE MACRO`
      # overlay through sqllogictest's `on_init`, against the binary `make` just built, so
      # 17 mutants and their 17 controls cost one build and not 34. Not piped through
      # `tee`: the harness's exit code IS the result (it exits 1 on a survivor, an
      # unverified kill, a broken overlay, or a stale copy), and a pipeline would hand
      # this step `tee`'s status instead -- the measurement in the `gate` job above
      # applies here too, and the cheapest way to be immune to it is not to pipe.
      - run: python3 test/run_mutants.py --increment mvp

  compile-differential:
    name: verbs compile identically in both implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      # NOTE: teaguesterling/duckent is the plan repo. The plan
      # (2026-10-09-duckent-cpp-mvp, Task 11) renames that repository to
      # duckent-plan at the very end -- when that happens, this checkout
      # must be updated to the new name in the SAME commit as the rename,
      # or this job starts failing for a reason that has nothing to do with
      # argument marshalling. Same note as macro-identity above; if the
      # rename happens, both jobs break together and are fixed in one commit.
      - uses: actions/checkout@v4
        with:
          repository: teaguesterling/duckent
          path: .plan
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install duckdb==1.5.5
      - run: make
      - run: python3 test/compile_differential.py --plan-repo .plan --duckdb ./build/release/duckdb

  from-source-load:
    name: the extension loads from a from-source build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - run: make
      # The configuration where TryAutoLoadAvailableExtension silently no-ops
      # (sitting_duck issue #82). If json or core_functions were autoloaded rather
      # than statically linked, the macros fail to load HERE and nowhere else.
      - run: ./build/release/duckdb -c "SELECT tree_canonical_columns()[1];"
