#
# Gates specific to this extension (as opposed to the generic extension-template
# workflows ExtensionTemplate.yml / MainDistributionPipeline.yml above it).
#
name: Tests
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  macro-identity:
    name: embedded macros match the plan repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      # NOTE: teaguesterling/duckent is the plan repo. The plan
      # (2026-10-09-duckent-cpp-mvp, Task 11) renames that repository to
      # duckent-plan at the very end -- when that happens, this checkout
      # must be updated to the new name in the SAME commit as the rename,
      # or this job starts failing for a reason that has nothing to do with
      # macro drift.
      - uses: actions/checkout@v4
        with:
          repository: teaguesterling/duckent
          path: .plan
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/check_macro_identity.py --plan-repo .plan
