- id: MN30
  file: MN30_comb_template.sql
  what: the registry's 'child' row loses its root equality, the same defect MN14 plants in
    tree_sql_children itself -- but planted in the ROW instead, so a kill proves the compiler
    reads the frozen TEMPLATE rather than calling the macro
  expect_fail: [test/sql/31_match.test, test/sql/46_slot_registry.test]
  # MN14's comment already says why it can no longer witness this through a compiled match:
  # Task 1 froze each combinator's template at INSERT time, so tree_sql_comb reads the frozen
  # row and redefining tree_sql_children afterward reaches nothing a match compiles. MN30 plants
  # the identical defect where it now lives -- directly in the row -- so there are still two
  # witnesses. 46_slot_registry.test's derivation gate sees it structurally: it substitutes the
  # row's template back and compares it against the macro called DIRECTLY, which a hand-edited
