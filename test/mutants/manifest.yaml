  # was the brief's other suggestion for this mutant and does NOT fail under it -- verified
  # directly -- so it is not listed: 47's own CHILD assertions all stay within app.parquet, which
  # this fixture set gives exactly one ROOT, so the dropped conjunct changes nothing it checks.
- id: MN31
  file: MN31_capability_ignored.sql
