  also_kills: 10_projection.test does NOT fail under this mutant -- checked under the
    every-suite-must-fail rule (test/run.py test/sql/10_projection.test --mutant
    MN01_encoder_tiebreak_desc.sql PASSes) -- its records happen not to distinguish the
    reversed source-order tiebreak on this fixture, so it moved out of expect_fail here.
