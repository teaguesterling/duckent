- id: MN03
  file: MN03_semantics_reads_o_accessor.sql
  what: a semantics-path function reads an O accessor -- the compiler picks its sibling form by
    whether SIZE is declared
  expect_fail: [test/sql/42_second_differential.test]
  also_kills: nothing; results cannot see it by construction. The two forms this mutant chooses
    between answer identically on a conforming tree -- _element is true on every row of a tree
    that declares no ELEMENT, so "the nearest element sibling" and "the row at _pre + _size + 1"
    are the same row. Only the compiled TEXT moves, and only for an ELEMENT-less tree, which is
    why 42 carries an ELEMENT-less pair and compares tree_explain(...).sql across it. Measured by
    running the whole suite under the mutant -- 42 is the only file that fails, 23 pass, and
    within 42 exactly three records fail. THREE of the four ELEMENT-less plan records, not
    four -- the `.fn:has(string)` one does not move, because the descendant relation does not
    branch on the element flag at all. That record is a guard against other mutations of the
    plan, not a discriminator for this one, and it is kept on that footing rather than
    counted as part of this kill.
  # The id is MN03's original claim restored. M2 used MN03 for the declared-SIZE-plus-one mutation;
